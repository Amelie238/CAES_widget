<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAES 2027</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --fond: #f5f6f8;
    --texte: #1d2430;
    --discret: #5d6675;
    --bord: #d9dde4;
    --bleu: #1f5fbf;   --bleu-fond: #eaf1fc;
    --vert: #1d7a46;   --vert-fond: #e7f5ed;
    --orange: #c2570c; --orange-fond: #fdf0e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 20px 32px;
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--texte); background: var(--fond);
  }
  h1 { margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .recherche { position: relative; max-width: 520px; margin-bottom: 18px; }
  .recherche input {
    width: 100%; padding: 10px 38px 10px 12px; font: inherit;
    border: 1px solid var(--bord); border-radius: 8px; background: #fff;
  }
  .recherche input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid #3b82f6; outline-offset: 1px;
  }
  .recherche button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; font-size: 16px; color: var(--discret); cursor: pointer; padding: 4px 8px;
  }
  #message { color: #9a1c1c; margin: 8px 0; }
  .blocs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .blocs { grid-template-columns: 1fr; } }

  .bloc { border: 2px solid var(--c); border-radius: 10px; background: var(--cf); overflow: hidden; }
  .bloc.b1 { --c: var(--bleu);   --cf: var(--bleu-fond); }
  .bloc.b2 { --c: var(--vert);   --cf: var(--vert-fond); }
  .bloc.b3 { --c: var(--orange); --cf: var(--orange-fond); }
  .bloc > header {
    background: var(--c); color: #fff; padding: 10px 14px;
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  }
  .bloc > header h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .bloc > header .nb { font-weight: 600; white-space: nowrap; }
  .liste { padding: 12px; display: grid; gap: 12px; }
  .vide { color: var(--discret); padding: 6px 2px; }

  .carte { background: #fff; border: 1px solid var(--bord); border-left: 5px solid var(--c); border-radius: 8px; padding: 10px 12px; }
  .carte h3 { margin: 0 0 6px; font-size: 15px; }
  .carte h3 small { font-weight: 500; color: var(--discret); margin-left: 6px; }
  .ligne { display: grid; grid-template-columns: 112px 1fr; gap: 8px; margin: 4px 0; align-items: start; }
  .ligne > span:first-child { color: var(--discret); }
  .ligne .val { word-break: break-word; }
  textarea, select {
    width: 100%; font: inherit; padding: 5px 7px; border: 1px solid var(--bord); border-radius: 6px; background: #fff;
  }
  textarea { resize: vertical; min-height: 44px; }
  label.coche { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--c); }
  .pied { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
          margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--bord); }
  .statut { font-weight: 600; border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .st-a { background: #fde8e8; color: #9a1c1c; }
  .st-t { background: #e3edfb; color: #1f4f9c; }
  .st-c { background: #dcefe3; color: #15613a; }
  .pied select { width: auto; }
</style>
</head>
<body>
  <h1>CAES 2027</h1>
  <div class="recherche">
    <input id="q" type="search" placeholder="Rechercher par nom, prénom ou numéro de dossier" aria-label="Rechercher un candidat" autocomplete="off">
    <button id="raz" type="button" title="Effacer la recherche" aria-label="Effacer la recherche">✕</button>
  </div>
  <div id="message"></div>
  <main class="blocs" id="blocs"></main>

<script>
/* ============================================================
   CONFIGURATION : adapter ici les titres de colonnes si besoin.
   La clé (à gauche) est le nom interne, "title" est ce qui
   s'affiche dans le panneau de mappage de Grist.
   ============================================================ */
const COLONNES = [
  { name: 'nom',          title: 'Nom',                              type: 'Text' },
  { name: 'prenom',       title: 'Prénom',                           type: 'Text' },
  { name: 'dossier',      title: 'Numéro de dossier',                type: 'Any'  },
  { name: 'saisine',      title: 'Type de saisine',                  type: 'Any'  },
  { name: 'typeBac',      title: 'Type de bac',                      type: 'Any',  optional: true },
  { name: 'specBac',      title: 'Spécialité du bac',                type: 'Any',  optional: true },
  { name: 'observation',  title: 'Observation',                      type: 'Any',  optional: true },
  { name: 'justif',       title: 'Justificatifs reçus (Oui/Non)',    type: 'Bool', optional: true },
  { name: 'avisMedecin',  title: 'Avis du médecin',                  type: 'Any',  optional: true },
  { name: 'avisMP',       title: 'Avis Maison de la Performance',    type: 'Any',  optional: true },
  { name: 'formation',    title: 'Formation souhaitée',              type: 'Any',  optional: true },
  { name: 'etablissement',title: 'Établissement destinataire',       type: 'Any',  optional: true },
  { name: 'avisEtab',     title: "Avis de l'établissement",          type: 'Any',  optional: true },
  { name: 'courrier',     title: 'Courrier envoyé (Oui/Non)',        type: 'Bool', optional: true },
  { name: 'commentaire',  title: 'Commentaire (situation finale)',   type: 'Any',  optional: true },
];
const STATUTS = ['À traiter', 'Traité', 'Clôturé'];

const BLOCS = [
  { id: 'b1', titre: 'Handicap / Médical', avis: { cle: 'avisMedecin', label: 'Avis du médecin' } },
  { id: 'b2', titre: 'SHN',                avis: { cle: 'avisMP',      label: 'Avis Maison de la Performance' } },
  { id: 'b3', titre: 'Autres situations (mutation, chargé de famille, mandat électoral...)', avis: null },
];

/* ---------- Utilitaires ---------- */
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const txt  = v => (v === null || v === undefined) ? '' : String(v);
const esc  = s => txt(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function blocDe(saisine) {
  const s = norm(saisine);
  if (s.includes('handicap') || s.includes('medic')) return 0;
  if (s.includes('shn')) return 1;
  return 2;
}
function statutDe(commentaire) {
  const c = norm(commentaire);
  if (c.includes('clotur')) return 'Clôturé';
  if (c.startsWith('a traiter') || c === '') return 'À traiter';
  if (c.includes('traite')) return 'Traité';
  return 'À traiter';
}
const classeStatut = s => s === 'Clôturé' ? 'st-c' : s === 'Traité' ? 'st-t' : 'st-a';

/* ---------- État ---------- */
let records = [];
let enEdition = false;     // évite de redessiner pendant une saisie
let enAttente = false;
const q = document.getElementById('q');
const blocsEl = document.getElementById('blocs');
const messageEl = document.getElementById('message');

/* ---------- Écriture dans Grist ---------- */
function maj(id, champs) {
  if (window.__DEMO__) {
    const r = records.find(x => x.id === id); Object.assign(r, champs); return;
  }
  grist.selectedTable.update({ id, fields: champs }).catch(e => {
    messageEl.textContent = "Impossible d'enregistrer : " + (e.message || e);
  });
}

/* ---------- Rendu ---------- */
function ligne(label, contenu) {
  return `<div class="ligne"><span>${label}</span><span class="val">${contenu}</span></div>`;
}
function champEditable(r, cle, label) {
  return `<div class="ligne"><span>${label}</span>
    <textarea data-id="${r.id}" data-champ="${cle}" rows="2">${esc(r[cle])}</textarea></div>`;
}

function carte(r, bloc) {
  const bac = [txt(r.typeBac), txt(r.specBac)].filter(Boolean).join(' – ');
  const statut = statutDe(r.commentaire);
  let h = `<article class="carte">
    <h3>${esc(r.nom).toUpperCase()} ${esc(r.prenom)} <small>Dossier n° ${esc(r.dossier)}</small></h3>`;
  h += ligne('Bac', esc(bac) || '—');
  h += ligne('Observation', esc(r.observation) || '—');
  h += ligne('Justificatifs', `<label class="coche"><input type="checkbox" data-id="${r.id}" data-champ="justif" ${r.justif ? 'checked' : ''}> Reçus</label>`);
  if (bloc.avis) h += champEditable(r, bloc.avis.cle, bloc.avis.label);
  h += ligne('Formation souhaitée', esc(r.formation) || '—');
  h += ligne('Établissement', esc(r.etablissement) || '—');
  h += champEditable(r, 'avisEtab', "Avis de l'établissement");
  h += `<div class="pied">
      <label class="coche"><input type="checkbox" data-id="${r.id}" data-champ="courrier" ${r.courrier ? 'checked' : ''}> Courrier envoyé : <strong>${r.courrier ? 'Oui' : 'Non'}</strong></label>
      <span><span class="statut ${classeStatut(statut)}" style="margin-right:8px">${statut}</span>
      <select data-id="${r.id}" data-champ="commentaire" aria-label="Situation finale">
        ${STATUTS.map(s => `<option ${s === statut ? 'selected' : ''}>${s}</option>`).join('')}
      </select></span>
    </div></article>`;
  return h;
}

function rendre() {
  const cle = norm(q.value);
  const groupes = [[], [], []];
  for (const r of records) {
    if (cle) {
      const cible = norm([r.nom, r.prenom, r.dossier, txt(r.prenom) + ' ' + txt(r.nom), txt(r.nom) + ' ' + txt(r.prenom)].join('|'));
      if (!cible.includes(cle)) continue;
    }
    groupes[blocDe(r.saisine)].push(r);
  }
  const scroll = window.scrollY;
  blocsEl.innerHTML = BLOCS.map((b, i) => `
    <section class="bloc ${b.id}">
      <header><h2>${esc(b.titre)}</h2><span class="nb">${groupes[i].length} dossier${groupes[i].length > 1 ? 's' : ''}</span></header>
      <div class="liste">${groupes[i].length ? groupes[i].map(r => carte(r, b)).join('') : '<div class="vide">Aucun dossier</div>'}</div>
    </section>`).join('');
  window.scrollTo(0, scroll);
}

/* ---------- Événements ---------- */
q.addEventListener('input', rendre);
document.getElementById('raz').addEventListener('click', () => { q.value = ''; rendre(); q.focus(); });

blocsEl.addEventListener('change', e => {
  const el = e.target, id = Number(el.dataset.id), champ = el.dataset.champ;
  if (!champ) return;
  if (el.type === 'checkbox') maj(id, { [champ]: el.checked });
  else if (champ === 'commentaire') maj(id, { commentaire: el.value });
  else maj(id, { [champ]: el.value });
  if (window.__DEMO__ || champ === 'commentaire' || el.type === 'checkbox') setTimeout(rendre, 0);
});
blocsEl.addEventListener('focusin', e => { if (e.target.tagName === 'TEXTAREA') enEdition = true; });
blocsEl.addEventListener('focusout', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  enEdition = false;
  if (enAttente) { enAttente = false; setTimeout(rendre, 0); }
});

/* ---------- Démarrage ---------- */
function surRecords(recs, mappings) {
  if (!mappings) {
    messageEl.textContent = 'Associez les colonnes dans le panneau « Colonnes visibles » du widget (Nom, Prénom, Numéro de dossier et Type de saisine sont obligatoires).';
    blocsEl.innerHTML = ''; return;
  }
  messageEl.textContent = '';
  records = recs;
  if (enEdition) { enAttente = true; return; }
  rendre();
}

if (window.self !== window.top || window.grist && location.search.includes('grist')) {
  grist.ready({ requiredAccess: 'full', columns: COLONNES });
  grist.onRecords(surRecords, { mapColumnNames: true });
} else {
  // Aperçu hors Grist : données de démonstration
  window.__DEMO__ = true;
  messageEl.textContent = 'Aperçu avec des données fictives (hors Grist).';
  records = [
    { id: 1, nom: 'Martin', prenom: 'Léa', dossier: 'D-001', saisine: 'Handicap', typeBac: 'Général', specBac: 'Maths / SVT', observation: 'Aménagements demandés', justif: false, avisMedecin: 'Favorable', formation: 'BUT Informatique', etablissement: 'IUT de Bordeaux', avisEtab: '', courrier: false, commentaire: 'À traiter' },
    { id: 2, nom: 'Durand', prenom: 'Karim', dossier: 'D-002', saisine: 'SHN', typeBac: 'STMG', specBac: '', observation: '', justif: true, avisMP: 'Avis en attente', formation: 'Licence STAPS', etablissement: 'UFR STAPS', avisEtab: 'Favorable', courrier: true, commentaire: 'Traité' },
    { id: 3, nom: 'Petit', prenom: 'Inès', dossier: 'D-003', saisine: 'Mutation', typeBac: 'Général', specBac: 'HGGSP / SES', observation: 'Mutation du parent', justif: false, formation: 'Licence Droit', etablissement: 'Faculté de droit', avisEtab: '', courrier: false, commentaire: 'Clôturé' },
    { id: 4, nom: 'Bernard', prenom: 'Paul', dossier: 'D-004', saisine: 'Médical', typeBac: 'Pro', specBac: 'Gestion', observation: '', justif: true, avisMedecin: 'Défavorable', formation: 'BTS', etablissement: 'Lycée Montesquieu', avisEtab: '', courrier: false, commentaire: '' },
  ];
  rendre();
}
</script>
</body>
</html>
